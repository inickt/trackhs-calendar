name: Keep Scheduled Workflows Alive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Keep scheduled workflows active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
          workflow_files: "trackhs-calendar-sync.yml"
